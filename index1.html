<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <form id="registrationForm" novalidate>

            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                >

                <small id="nameError" class="error"></small>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

                <small id="emailError" class="error"></small>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                >

                <small id="passwordError" class="error"></small>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                >

                <small
                    id="confirmPasswordError"
                    class="error">
                </small>

            </div>


            <!-- Country -->

            <div class="form-group">

                <label for="country">
                    Country
                </label>

                <select id="country" disabled>

                    <option value="">
                        Select Country
                    </option>

                    <option value="India">
                        India
                    </option>

                    <option value="USA">
                        USA
                    </option>

                    <option value="UK">
                        UK
                    </option>

                </select>

                <small id="countryError" class="error"></small>

            </div>


            <!-- Terms -->

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="terms"
                >

                <label for="terms">
                    I agree to the terms and conditions
                </label>

            </div>

            <small id="termsError" class="error"></small>


            <!-- Submit -->

            <button
                type="submit"
                id="submitBtn"
                disabled
            >
                Register
            </button>

            <p id="successMessage" class="success"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
